name: Quality gate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: keelwatch_ci
          POSTGRES_USER: keelwatch_ci
          POSTGRES_PASSWORD: keelwatch_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keelwatch_ci -d keelwatch_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      AUTH_MODE: local
      ACCESS_STORE: prisma
      WEB_ORIGIN: http://localhost:5173
      VITE_AUTH_MODE: local
      VITE_API_URL: /api/v1
      DATABASE_URL: postgresql://keelwatch_ci:keelwatch_ci_only@localhost:5432/keelwatch_ci?schema=public

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run prisma:seed
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:postgres
      - run: npm run check:env
      - run: npm run audit:conventions
      - run: npm run prisma:validate
      - run: npm run prisma:migration:check
      - run: npm run build
      - run: npm audit --audit-level=high
