services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keelwatch
      POSTGRES_USER: keelwatch
      POSTGRES_PASSWORD: keelwatch-local-only
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keelwatch -d keelwatch']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - keelwatch-postgres:/var/lib/postgresql/data

volumes:
  keelwatch-postgres:
